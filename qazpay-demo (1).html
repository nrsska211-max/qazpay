<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QAZPAY DEMO — банковский симулятор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0D9488; --brand-deep:#0F5D57; --brand-soft:#CFF3EE; --mint:#2DD4BF;
  --demo:#F59E0B; --demo-deep:#B45309;
  --ink:#0E1B24; --ink-2:#4A5B67; --ink-3:#8496A1;
  --line:#E4ECEC; --line-2:#EEF3F3;
  --surface:#FFFFFF; --surface-2:#F5F8F8; --bg:#EDF2F2;
  --pos:#16A34A; --neg:#DC2626; --warn:#F59E0B;
  --shadow:0 18px 40px -20px rgba(14,27,36,.35);
  --shadow-sm:0 6px 18px -10px rgba(14,27,36,.30);
  --r:22px; --r-sm:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --brand:#2DD4BF; --brand-deep:#0B3D39; --brand-soft:#123531; --mint:#5EEAD4;
  --ink:#EAF2F1; --ink-2:#A9BDBA; --ink-3:#6E8582;
  --line:#1D2C2B; --line-2:#182322;
  --surface:#101A1A; --surface-2:#0B1414; --bg:#070E0E;
  --shadow:0 18px 44px -18px rgba(0,0,0,.7);
  --shadow-sm:0 8px 20px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0;font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, #113f3a12, transparent),
    radial-gradient(900px 500px at -10% 110%, #0d948814, transparent),
    #0a1615;
  color:var(--ink);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  min-height:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ---------- device frame ---------- */
.device{
  position:relative;width:min(430px,100vw);height:min(920px,100dvh);
  background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
  border-radius:44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 12px #05100f,0 0 0 13px #223533;
}
@media (max-width:480px){
  body{display:block}
  .device{width:100vw;height:100dvh;border-radius:0;box-shadow:none;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#05100f;border-radius:0 0 16px 16px;z-index:60}
@media (max-width:480px){.notch{display:none}}

/* ---------- top chrome ---------- */
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 4px;font-size:13px;font-weight:700;color:var(--ink);background:var(--surface)}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.statusbar svg{width:16px;height:16px}
.demo-ribbon{
  display:flex;align-items:center;gap:8px;justify-content:center;
  background:repeating-linear-gradient(135deg,var(--demo),var(--demo) 14px,var(--demo-deep) 14px,var(--demo-deep) 28px);
  color:#fff;font-weight:800;font-size:11px;letter-spacing:.14em;padding:5px 10px;
  text-shadow:0 1px 1px rgba(0,0,0,.35);z-index:40;
}
.demo-ribbon .dot{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}

/* ---------- viewport / screens ---------- */
.viewport{position:relative;flex:1;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 108px;opacity:0;transform:translateX(16px);pointer-events:none;transition:opacity .28s ease,transform .28s ease}
.screen.active{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.screen{transition:none}}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;
  background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:10px;font-weight:700;padding:4px 10px;border-radius:12px;transition:color .2s}
.tab svg{width:23px;height:23px}
.tab.active{color:var(--brand)}
.tab.center{margin-top:-26px}
.tab.center .fab{width:56px;height:56px;border-radius:20px;background:linear-gradient(160deg,var(--brand),var(--brand-deep));color:#fff;display:grid;place-items:center;box-shadow:0 12px 24px -8px var(--brand)}
.tab.center .fab svg{width:26px;height:26px}
.tab.center span{color:var(--brand)}

/* ---------- components ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);border:1px solid var(--line-2)}
.pad{padding:16px}
.h-row{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 10px}
.h-row h2{font-size:16px;margin:0;font-weight:800}
.h-row a{font-size:13px;color:var(--brand);font-weight:700}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.iconbtn{width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:15px;background:linear-gradient(160deg,var(--brand),var(--brand-deep));color:#fff;box-shadow:0 12px 24px -12px var(--brand)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:linear-gradient(160deg,#ef4444,#b91c1c);box-shadow:0 12px 24px -12px #ef4444}
.btn:disabled{opacity:.5}
.btn.small{width:auto;padding:11px 16px;font-size:13px;border-radius:13px}
.field{margin:12px 0}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 2px 6px}
.field input,.field select,.field textarea{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:15px;font-weight:600}
.field textarea{resize:none;min-height:64px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);border-color:transparent}

/* header block */
.pagehead{display:flex;align-items:center;gap:12px;margin:4px 2px 8px}
.pagehead h1{font-size:22px;font-weight:800;margin:0;flex:1}
.pagehead .back{width:40px;height:40px;border-radius:13px;background:var(--surface);display:grid;place-items:center;border:1px solid var(--line-2)}

/* balance hero */
.hero{background:linear-gradient(155deg,#0f766e,#0c4a45 60%,#0a3b37);color:#fff;border-radius:26px;padding:20px;position:relative;overflow:hidden;box-shadow:0 24px 40px -22px #0f766e}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.35),transparent 70%)}
.hero .lbl{opacity:.8;font-size:13px;font-weight:600}
.hero .bal{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:6px 0 2px}
.hero .sub{opacity:.85;font-size:12.5px}
.hero-actions{display:flex;gap:10px;margin-top:18px;position:relative;z-index:2}
.hero-actions button{flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:15px;padding:11px 6px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px}
.hero-actions svg{width:20px;height:20px}

/* tx rows */
.txrow{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer}
.txrow+.txrow{border-top:1px solid var(--line-2)}
.txrow .meta{flex:1;min-width:0}
.txrow .meta .t{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txrow .meta .s{font-size:12px;color:var(--ink-2);margin-top:2px}
.txrow .amt{font-weight:800;font-size:15px;text-align:right;white-space:nowrap}
.amt.pos{color:var(--pos)} .amt.neg{color:var(--ink)}
.badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:7px}
.badge.SUCCESS{background:#dcfce7;color:#15803d}
.badge.DEMO{background:#fef3c7;color:#b45309}
.badge.CANCELLED{background:#fee2e2;color:#b91c1c;text-decoration:line-through}
:root[data-theme="dark"] .badge.SUCCESS{background:#0c3b24;color:#4ade80}
:root[data-theme="dark"] .badge.DEMO{background:#3d2c05;color:#fbbf24}
:root[data-theme="dark"] .badge.CANCELLED{background:#3b1414;color:#f87171}

/* card visual */
.vcard{border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.vcard .demo-wm{position:absolute;right:14px;top:14px;font-size:10px;font-weight:800;letter-spacing:.14em;background:rgba(0,0,0,.28);padding:4px 8px;border-radius:8px}
.vcard .brand{font-weight:800;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.vcard .num{font-size:19px;letter-spacing:.14em;font-weight:700;margin-top:auto}
.vcard .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;font-size:12px}
.vcard .chipico{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#f8d77b,#d9a441);opacity:.9}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(6,16,15,.5);opacity:0;pointer-events:none;transition:opacity .28s;z-index:70}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.72,.29,1);z-index:80;max-height:92%;overflow-y:auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grip{width:38px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 2px 4px;font-size:19px;font-weight:800}
.sheet .sub{margin:0 2px 14px;font-size:13px;color:var(--ink-2)}

/* amount display */
.amount-box{text-align:center;padding:14px 0 6px}
.amount-box .cur{font-size:20px;color:var(--ink-3);font-weight:700}
.amount-box input{border:none;background:transparent;text-align:center;font-size:42px;font-weight:800;color:var(--ink);width:100%;letter-spacing:-1px}
.amount-box input:focus{outline:none}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.quick button{padding:8px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--ink-2)}

/* recipient pick */
.people{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px}
.person .avatar{width:52px;height:52px;border-radius:18px}
.person span{font-size:11px;font-weight:700;text-align:center;line-height:1.15}
.person.sel .avatar{outline:3px solid var(--brand);outline-offset:2px}

/* toast */
.toasts{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;right:12px;z-index:120;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;transform:translateY(-14px);opacity:0;transition:.3s}
.toast.show{transform:none;opacity:1}
.toast .ic{width:22px;height:22px;border-radius:7px;background:var(--brand);display:grid;place-items:center;flex:none}
.toast .ic svg{width:14px;height:14px}

/* processing overlay */
.processing{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(3px);display:none;flex-direction:column;gap:16px;align-items:center;justify-content:center;z-index:100}
.processing.on{display:flex}
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .8s linear infinite}
.check-anim{width:66px;height:66px;border-radius:50%;background:var(--pos);display:grid;place-items:center;color:#fff}
.check-anim svg{width:34px;height:34px}
@keyframes spin{to{transform:rotate(360deg)}}
.processing p{font-weight:700;color:var(--ink)}

/* splash */
.splash{position:absolute;inset:0;z-index:200;background:linear-gradient(165deg,#0f766e,#0a3b37);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;transition:opacity .5s}
.splash.hide{opacity:0;pointer-events:none}
.splash .logo{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:800;letter-spacing:-.5px}
.splash .mark{width:52px;height:52px;border-radius:17px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.splash .mark svg{width:30px;height:30px}
.splash .demo-tag{margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.2em;background:var(--demo);padding:5px 12px;border-radius:8px}
.splash .load{width:120px;height:4px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:8px}
.splash .load i{display:block;height:100%;width:40%;background:#fff;border-radius:3px;animation:load 1.4s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

/* auth */
.auth{position:absolute;inset:0;z-index:150;background:linear-gradient(165deg,#0f766e,#0a3b37);display:flex;flex-direction:column;justify-content:center;padding:24px;overflow-y:auto;transition:opacity .4s}
.auth.hidden{opacity:0;pointer-events:none}
.auth .brand{display:flex;align-items:center;gap:11px;justify-content:center;color:#fff;font-size:26px;font-weight:800;margin-bottom:4px}
.auth .brand .mark{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.auth .brand .mark svg{width:26px;height:26px}
.auth .tag{text-align:center;color:#cdeee9;font-size:12px;margin-bottom:18px;font-weight:600}
.auth .panel{background:var(--surface);border-radius:22px;padding:20px;box-shadow:0 24px 50px -20px rgba(0,0,0,.5)}
.auth .panel h2{margin:0 0 4px;font-size:20px;font-weight:800}
.auth .panel .p{margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.auth .err{color:var(--neg);font-size:12.5px;font-weight:700;margin:2px 2px 0;min-height:16px}
.auth .link{display:block;text-align:center;color:#cdeee9;font-size:12.5px;font-weight:700;margin-top:16px}
.pw-wrap{position:relative}
.pw-wrap .eye{position:absolute;right:10px;top:9px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.pw-wrap .eye svg{width:19px;height:19px}
.auth .note{font-size:11px;color:var(--ink-3);margin-top:12px;line-height:1.4;text-align:center}

/* misc */
.stat{display:flex;gap:10px}
.stat .box{flex:1;background:var(--surface-2);border-radius:16px;padding:12px;border:1px solid var(--line-2)}
.stat .box .k{font-size:11px;color:var(--ink-2);font-weight:700}
.stat .box .v{font-size:16px;font-weight:800;margin-top:3px}
.catbar{height:8px;border-radius:5px;background:var(--line-2);overflow:hidden;margin-top:7px}
.catbar i{display:block;height:100%;border-radius:5px}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 4px}
.list-item+.list-item{border-top:1px solid var(--line-2)}
.list-item .ic{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--brand)}
.list-item .ic svg{width:19px;height:19px}
.list-item .g{flex:1}
.list-item .g .t{font-weight:700;font-size:14px}
.list-item .g .s{font-size:12px;color:var(--ink-2)}
.switch{width:44px;height:26px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch.on{background:var(--brand)}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on i{left:21px}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.empty svg{width:44px;height:44px;margin-bottom:10px;opacity:.5}
.notif{display:flex;gap:12px;padding:14px 4px}
.notif+.notif{border-top:1px solid var(--line-2)}
.notif .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
.notif.read .dot{background:var(--line)}
.notif .g{flex:1}
.notif .g .t{font-weight:700;font-size:14px}
.notif .g .b{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.notif .g .tm{font-size:11px;color:var(--ink-3);margin-top:4px}

/* statement / document */
.doc{background:#fff;color:#111;border-radius:16px;padding:22px 18px;position:relative;overflow:hidden;border:1px solid #e5e5e5}
.doc .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden}
.doc .wm span{font-size:64px;font-weight:800;color:rgba(245,158,11,.13);transform:rotate(-24deg);white-space:nowrap;letter-spacing:.1em}
.doc-banner{background:repeating-linear-gradient(135deg,#F59E0B,#F59E0B 12px,#B45309 12px,#B45309 24px);color:#fff;font-weight:800;font-size:11px;text-align:center;padding:8px;border-radius:10px;letter-spacing:.06em;margin-bottom:16px;position:relative;z-index:2}
.doc h4{margin:0 0 2px;font-size:18px;position:relative;z-index:2}
.doc .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #e5e5e5;position:relative;z-index:2}
.doc .row b{color:#111}
.doc .tot{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-top:10px;position:relative;z-index:2}
.doc .fine{font-size:10px;color:#999;margin-top:14px;position:relative;z-index:2;line-height:1.4}
.doc table{width:100%;border-collapse:collapse;font-size:11px;position:relative;z-index:2;margin-top:8px}
.doc th{text-align:left;color:#666;font-weight:700;padding:5px 4px;border-bottom:1.5px solid #333}
.doc td{padding:6px 4px;border-bottom:1px solid #eee}

.info-note{background:var(--brand-soft);color:var(--brand-deep);border-radius:14px;padding:12px 14px;font-size:12px;font-weight:600;line-height:1.4;display:flex;gap:9px}
:root[data-theme="dark"] .info-note{color:var(--mint)}
.info-note svg{width:18px;height:18px;flex:none;margin-top:1px}
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:4px;gap:4px;margin:2px 0}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.editico{display:inline-flex;align-items:center}
.editico svg{width:14px;height:14px}
.edit-affordance{cursor:pointer}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="notch"></div>

  <!-- splash -->
  <div class="splash" id="splash">
    <div class="logo"><span class="mark" id="splashMark"></span>QAZPAY</div>
    <div class="demo-tag">DEMO · SANDBOX</div>
    <div class="load"><i></i></div>
  </div>

  <!-- auth (registration / login) -->
  <div class="auth hidden" id="auth"></div>

  <!-- top chrome -->
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span class="sb-r" id="sbicons"></span>
  </div>
  <div class="demo-ribbon">
    <span class="dot"></span>DEMO · ДЕМОНСТРАЦИОННЫЙ ПРОТОТИП · НЕ НАСТОЯЩИЙ БАНК<span class="dot"></span>
  </div>

  <div class="toasts" id="toasts"></div>

const SYM={KZT:'₸',USD:'$',EUR:'€'};
function me(){return state.users.find(u=>u.id===state.currentUserId)}
function userById(id){return state.users.find(u=>u.id===id)}
function fmt(n,cur='KZT'){
  const s=(Math.round(n*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2});
  return s+' '+(SYM[cur]||cur);
}
function fmtDT(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'})+', '+
         d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateFull(iso){return new Date(iso).toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'})}
function relTime(iso){
  const diff=(Date.now()-new Date(iso))/1000;
  if(diff<3600)return Math.max(1,Math.floor(diff/60))+' мин назад';
  if(diff<86400)return Math.floor(diff/3600)+' ч назад';
  return Math.floor(diff/86400)+' дн назад';
}
function initials(n){return n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function sign(tx){ // + incoming, - outgoing relative to current user
  const m=state.currentUserId;
  if(tx.receiverId===m && tx.senderId!==m)return 1;
  if(tx.senderId===m)return -1;
  if(tx.type==='income'||tx.type==='topup')return 1;
  return -1;
}
function amtStr(tx){
  if(tx.status==='CANCELLED')return fmt(tx.amount,tx.currency);
  return (sign(tx)>0?'+ ':'− ')+fmt(tx.amount,tx.currency);
}

/* ============================ ACTIONS ============================ */
function processing(text,cb,ms=1200){
  const p=document.getElementById('processing');
  document.getElementById('procInner').innerHTML='<div class="spinner"></div>';
  document.getElementById('procText').textContent=text||'Обработка операции…';
  p.classList.add('on');
  setTimeout(()=>{
    document.getElementById('procInner').innerHTML='<div class="check-anim">'+I.check+'</div>';
    document.getElementById('procText').textContent='Готово';
    setTimeout(()=>{p.classList.remove('on');cb&&cb();},700);
  },ms);
}
function pushNotif(title,body){state.notifications.unshift({id:uid('n_'),title,body,time:new Date().toISOString(),read:false});}
function makeTx(o){return Object.assign({id:uid('tx_'),txId:genTxId(),currency:me().currency,dateTime:new Date().toISOString(),status:'SUCCESS',comment:''},o)}

function getAmt(id){const v=parseFloat(String(document.getElementById(id).value).replace(/\s/g,'').replace(',','.'));return isNaN(v)?0:v;}

function doTransfer(){
  const rid=sheetState.ctx.recipient;
  if(!rid){toast('Выберите получателя','x');return;}
  const amt=getAmt('amtInput');const u=me();
  if(amt<=0){toast('Введите сумму','x');return;}
  if(amt>u.balance){toast('Недостаточно средств на демо-счёте','x');return;}
  const r=userById(rid);const com=document.getElementById('tComment').value.trim();
  closeSheet();
  processing('Выполняем перевод…',()=>{
    u.balance-=amt; if(r&&!r.merchant)r.balance+=amt;
    const tx=makeTx({amount:amt,type:'transfer',category:'transfer',senderId:u.id,senderName:u.name,receiverId:r.id,receiverName:r.name,comment:com});
    state.transactions.push(tx);
    pushNotif('Перевод выполнен · демо',`${fmt(amt)} → ${r.name}`);
    save();renderAll();toast('Перевод на '+fmt(amt)+' выполнен','check');
    setTimeout(()=>openSheet('txdetail',{id:tx.id}),400);
  });
}
function doTopup(){
  const amt=getAmt('amtInput');const u=me();
  if(amt<=0){toast('Введите сумму','x');return;}
  const com=document.getElementById('tComment').value.trim()||'Демо-пополнение';
  closeSheet();
  processing('Пополняем баланс…',()=>{
    u.balance+=amt;
    const tx=makeTx({amount:amt,type:'income',category:'income',senderId:null,senderName:'Пополнение (демо)',receiverId:u.id,receiverName:u.name,comment:com});
    state.transactions.push(tx);pushNotif('Пополнение · демо',`Баланс пополнен на ${fmt(amt)}`);
    save();renderAll();toast('Пополнено на '+fmt(amt),'check');
  });
}
function doWithdraw(){
  const amt=getAmt('amtInput');const u=me();
  if(amt<=0){toast('Введите сумму','x');return;}
  if(amt>u.balance){toast('Недостаточно средств','x');return;}
  const com=document.getElementById('tComment').value.trim()||'Снятие (демо)';
  closeSheet();
  processing('Обрабатываем снятие…',()=>{
    u.balance-=amt;
    const tx=makeTx({amount:amt,type:'withdraw',category:'withdraw',senderId:u.id,senderName:u.name,receiverId:null,receiverName:'Снятие наличных (демо)',comment:com});
    state.transactions.push(tx);pushNotif('Снятие · демо',`Списано ${fmt(amt)}`);
    save();renderAll();toast('Снято '+fmt(amt),'check');
  });
}
function sbCreateAccount(){
  const name=document.getElementById('acName').value.trim()||'Тест Пользователь';
  const bal=parseFloat(document.getElementById('acBal').value)||0;
  const cur=document.getElementById('acCur').value;
  const u={id:uid('u_'),name,phone:'+7 700 '+Math.floor(1000000+Math.random()*8999999),color:AV_COLORS[state.users.length%AV_COLORS.length],currency:cur,balance:bal,card:null};
  state.users.push(u);save();renderAll();closeSheet();toast('Счёт «'+name+'» создан','check');
}
function sbSaveBal(){
  const u=userById(sheetState.ctx.id);const v=parseFloat(document.getElementById('sbBal').value)||0;
  u.balance=v;save();renderAll();closeSheet();toast('Баланс обновлён','check');
}
function sbCreateTx(){
  const fromId=document.getElementById('txFrom').value||null;
  const toId=document.getElementById('txTo').value||null;
  const amt=parseFloat(document.getElementById('txAmt').value)||0;
  const cur=document.getElementById('txCur').value;
  const status=document.getElementById('txStatus').value;
  const cat=document.getElementById('txCat').value;
  const com=document.getElementById('txCom').value.trim();
  if(amt<=0){toast('Введите сумму','x');return;}
  const from=fromId?userById(fromId):null, to=toId?userById(toId):null;
  const tx=makeTx({amount:amt,currency:cur,status,category:cat,type:'transfer',
    senderId:fromId,senderName:from?from.name:'Внешний источник',
    receiverId:toId,receiverName:to?to.name:'Внешний получатель',comment:com});
  state.transactions.push(tx);
  if(status!=='CANCELLED'){if(from&&!from.merchant)from.balance-=amt;if(to&&!to.merchant)to.balance+=amt;}
  save();renderAll();closeSheet();toast('Транзакция создана','check');
}
function cancelTx(id){
  const tx=state.transactions.find(t=>t.id===id);if(!tx)return;
  if(tx.status==='CANCELLED')return;
  // reverse balances
  if(tx.senderId){const s=userById(tx.senderId);if(s&&!s.merchant)s.balance+=tx.amount;}
  if(tx.receiverId){const r=userById(tx.receiverId);if(r&&!r.merchant)r.balance-=tx.amount;}
  tx.status='CANCELLED';
  pushNotif('Операция отменена · демо',`${tx.txId} отменена`);
  save();renderAll();closeSheet();toast('Операция отменена','check');
}
function deleteTx(id){
  const tx=state.transactions.find(t=>t.id===id);if(!tx)return;
  if(tx.status!=='CANCELLED'){ // reverse first
    if(tx.senderId){const s=userById(tx.senderId);if(s&&!s.merchant)s.balance+=tx.amount;}
    if(tx.receiverId){const r=userById(tx.receiverId);if(r&&!r.merchant)r.balance-=tx.amount;}
  }
  state.transactions=state.transactions.filter(t=>t.id!==id);
  save();renderAll();closeSheet();toast('Операция удалена','trash');
}
function saveEditTx(id){
  const tx=state.transactions.find(t=>t.id===id);if(!tx)return;
  const oldAmt=tx.amount,oldStatus=tx.status;
  const newAmt=parseFloat(document.getElementById('eAmt').value)||0;
  const newStatus=document.getElementById('eStatus').value;
  // reverse old effect if it was active
  if(oldStatus!=='CANCELLED'){if(tx.senderId){const s=userById(tx.senderId);if(s&&!s.merchant)s.balance+=oldAmt;}if(tx.receiverId){const r=userById(tx.receiverId);if(r&&!r.merchant)r.balance-=oldAmt;}}
  tx.amount=newAmt;tx.status=newStatus;tx.category=document.getElementById('eCat').value;tx.comment=document.getElementById('eCom').value.trim();
  if(newStatus!=='CANCELLED'){if(tx.senderId){const s=userById(tx.senderId);if(s&&!s.merchant)s.balance-=newAmt;}if(tx.receiverId){const r=userById(tx.receiverId);if(r&&!r.merchant)r.balance+=newAmt;}}
  save();renderAll();closeSheet();toast('Изменения сохранены','check');
}
function sbDeleteAccount(id){
  if(id===state.currentUserId)return;
  state.users=state.users.filter(u=>u.id!==id);
  save();renderAll();toast('Счёт удалён','trash');
}
function sbSwitch(id){
  state.currentUserId=id;save();renderAll();showScreen('s-home');
  toast('Активный счёт: '+me().name,'user');
}

];
function renderTabbar(){
  document.getElementById('tabbar').innerHTML=TABS.map(t=>{
    if(t.center)return `<button class="tab center" data-action="open" data-sheet="transfer"><span class="fab">${t.ic}</span><span>${t.label}</span></button>`;
    return `<button class="tab ${lastTab===t.id?'active':''}" data-action="tab" data-tab="${t.id}">${t.ic}<span>${t.label}</span></button>`;
  }).join('');
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.getElementById(id).scrollTop=0;
  if(TABS.some(t=>t.id===id)||['s-profile','s-notifications','s-categories','s-settings'].includes(id)){
    if(TABS.some(t=>t.id===id))lastTab=id;
    else if(['s-profile','s-notifications','s-categories','s-settings'].includes(id))lastTab='s-more';
  }
  if(id==='s-doc')lastTab=lastTab; else if(TABS.some(t=>t.id===id))lastTab=id;
  renderTabbar();
}
function renderAll(){
  renderHome();renderHistory();renderCards();renderSandbox();renderMore();
  renderProfile();renderNotifications();renderCategories();renderSettings();
}

/* ============================ TOAST ============================ */
function toast(msg,icon='check'){
  const wrap=document.getElementById('toasts');
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span class="ic">${I[icon]||I.check}</span><span>${msg}</span>`;
  wrap.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2600);
}

/* ============================ THEME ============================ */
function applyTheme(){document.documentElement.setAttribute('data-theme',state.settings.theme);}

/* ============================ EVENT DELEGATION ============================ */
document.getElementById('device').addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action, d=el.dataset;
  switch(a){
    case 'tab': showScreen(d.tab); break;
    case 'open': openSheet(d.sheet,{recipient:d.recipient}); break;
    case 'close-sheet': closeSheet(); break;
    case 'quickamt':{const i=document.getElementById('amtInput');i.value=(parseFloat(i.value)||0)+parseInt(d.a);break;}
    case 'pick-person': sheetState.ctx.recipient=d.id;
      document.querySelectorAll('.person').forEach(p=>p.classList.toggle('sel',p.dataset.id===d.id));break;
    case 'do-transfer': doTransfer(); break;
    case 'do-topup': doTopup(); break;
    case 'do-withdraw': doWithdraw(); break;
    case 'txdetail': openSheet('txdetail',{id:d.id}); break;
    case 'edit-tx': openSheet('edit-tx',{id:d.id}); break;
    case 'save-edit-tx': saveEditTx(d.id); break;
    case 'cancel-tx': cancelTx(d.id); break;
    case 'delete-tx': deleteTx(d.id); break;
    case 'histcat': histFilter.cat=d.cat; renderHistory(); break;
    case 'sb-account': break;
    case 'sb-create-account': sbCreateAccount(); break;
    case 'sb-setbal': openSheet('sb-setbal',{id:d.id}); break;
    case 'sb-save-bal': sbSaveBal(); break;
    case 'sb-create-tx': sbCreateTx(); break;
    case 'sb-switch': sbSwitch(d.id); break;
    case 'sb-del-acc': sbDeleteAccount(d.id); break;
    case 'gen-statement': genStatement(); break;
    case 'gen-document': genDocument(); break;
    case 'print-doc': printDoc(); break;
    case 'back-from-doc': showScreen(lastTab==='s-doc'?'s-sandbox':lastTab); break;
    case 'reset': resetAll(); break;
    case 'toggle-theme': state.settings.theme=state.settings.theme==='dark'?'light':'dark';applyTheme();save();renderSettings();break;
    case 'toggle-notifs': state.settings.notifs=!state.settings.notifs;save();renderSettings();break;
    case 'toggle-hide': state.settings.hideBalance=!state.settings.hideBalance;save();renderSettings();renderHome();break;
    case 'notif-read-all': state.notifications.forEach(n=>n.read=true);save();renderNotifications();toast('Уведомления прочитаны','check');break;
    case 'demo-block': toast('Это симулятор — карту нельзя заблокировать','info');break;
    case 'do-register': doRegister(); break;
    case 'do-login': doLogin(); break;
    case 'auth-reset': authReset(); break;
    case 'toggle-pw': pwVisible=!pwVisible; renderAuth(); break;
    case 'logout': logout(); break;
    case 'edit-profile': openSheet('edit-me'); break;
    case 'setbal':{const i=document.getElementById('meBal');if(i)i.value=d.a;break;}
    case 'save-me':{
      const u=me();
      const nm=document.getElementById('meName').value.trim();
      const ph=document.getElementById('mePhone').value.trim();
      const bal=parseFloat(String(document.getElementById('meBal').value).replace(/\s/g,'').replace(',','.'));
      const cur=document.getElementById('meCur').value;
      const holderEl=document.getElementById('meHolder');
      if(nm)u.name=nm;
      if(ph)u.phone=ph;
      if(!isNaN(bal))u.balance=bal;
      u.currency=cur;
      if(u.card){if(holderEl&&holderEl.value.trim())u.card.holder=holderEl.value.trim();}
      save();renderAll();closeSheet();toast('Профиль обновлён','check');
      break;}
  }
});
document.getElementById('scrim').addEventListener('click',closeSheet);
// segmented control inside statement sheet
document.getElementById('sheet').addEventListener('click',e=>{
  const b=e.target.closest('#stPeriod button');if(b){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}
});

/* ============================ CLOCK ============================ */
function tickClock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
setInterval(tickClock,10000);tickClock();

/* ============================ AUTH (регистрация / вход) ============================ */
let pwVisible=false;
function pwField(id,ph){
  return `<div class="pw-wrap">
    <input id="${id}" type="${pwVisible?'text':'password'}" placeholder="${ph}" autocomplete="off">
    <button type="button" class="eye" data-action="toggle-pw">${pwVisible?I.eyeoff:I.eye}</button>
  </div>`;
}
function renderAuth(){
  const a=state.auth;
  const box=document.getElementById('auth');
  const head=`<div class="brand"><span class="mark">${I.wallet}</span>QAZPAY</div>
    <div class="tag">DEMO · демонстрационный прототип</div>`;
  if(!a){
    box.innerHTML=head+`<div class="panel">
      <h2>Регистрация</h2><p class="p">Создайте демо-аккаунт для входа в симулятор.</p>
      <div class="field"><label>Имя</label><input id="regFirst" placeholder="Иван" autocomplete="off"></div>
      <div class="field"><label>Фамилия</label><input id="regLast" placeholder="Иванов" autocomplete="off"></div>
      <div class="field"><label>Пароль</label>${pwField('regPass','Не менее 4 символов')}</div>
      <div class="field"><label>Повторите пароль</label>${pwField('regPass2','Повторите пароль')}</div>
      <div class="err" id="authErr"></div>
      <button class="btn" data-action="do-register">Зарегистрироваться</button>
      <div class="note">Это демонстрационный вход. Пароль хранится только в вашем браузере и не является настоящей защитой. Не используйте реальные пароли.</div>
    </div>`;
  }else{
    box.innerHTML=head+`<div class="panel">
      <h2>С возвращением, ${a.firstName}!</h2><p class="p">Введите пароль, чтобы войти в демо-аккаунт.</p>
      <div class="field"><label>Пароль</label>${pwField('logPass','Ваш пароль')}</div>
      <div class="err" id="authErr"></div>
      <button class="btn" data-action="do-login">Войти</button>
      <a class="link" data-action="auth-reset">Забыли пароль? Зарегистрироваться заново</a>
    </div>`;
  }
  box.classList.remove('hidden');
}
function authErr(msg){const e=document.getElementById('authErr');if(e)e.textContent=msg;}
function doRegister(){
  const f=document.getElementById('regFirst').value.trim();
  const l=document.getElementById('regLast').value.trim();
  const p=document.getElementById('regPass').value;
  const p2=document.getElementById('regPass2').value;
  if(!f||!l){authErr('Укажите имя и фамилию');return;}
  if(p.length<4){authErr('Пароль должен быть не короче 4 символов');return;}
  if(p!==p2){authErr('Пароли не совпадают');return;}
  state.auth={firstName:f,lastName:l,password:p};
  const u=me();u.name=f+' '+l;if(u.card)u.card.holder=(f+' '+l).toUpperCase();
  save();renderAll();
  document.getElementById('auth').classList.add('hidden');
  toast('Аккаунт создан. Добро пожаловать!','check');
}
function doLogin(){
  const p=document.getElementById('logPass').value;
  if(p!==state.auth.password){authErr('Неверный пароль');return;}
  document.getElementById('auth').classList.add('hidden');
  renderAll();
  toast('Вход выполнен','check');
}
function authReset(){
  state.auth=null;save();pwVisible=false;renderAuth();
}
function logout(){
  document.getElementById('auth').classList.remove('hidden');
  pwVisible=false;renderAuth();
}

/* ============================ BOOT ============================ */
try{
  load();applyTheme();renderAll();renderTabbar();renderAuth();
}catch(err){
  console.error('QAZPAY DEMO boot error:',err);
  try{state=seed();applyTheme();renderAll();renderTabbar();renderAuth();}catch(e2){console.error(e2);}
}
setTimeout(()=>{var s=document.getElementById('splash');if(s)s.classList.add('hide');},1700);
</script>
